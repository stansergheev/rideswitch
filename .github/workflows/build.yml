name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk RideSwitch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RideSwitch
          path: RideSwitch.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest RideSwitch.apk \
            --title "RideSwitch build ${{ github.run_number }}" \
            --notes "Download RideSwitch.apk below. Built from ${{ github.sha }}." \
            --target "${{ github.sha }}"
